name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools,platforms;android-34,build-tools;34.0.0,cmdline-tools;latest

      - name: Grant execute permission for gradlew
        run: chmod +x WebCamApp/gradlew
        working-directory: WebCamApp

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: WebCamApp
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WebCamApp-debug-apk
          path: WebCamApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: WebCamApp/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true