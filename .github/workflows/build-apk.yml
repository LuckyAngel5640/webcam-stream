name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کدها
        uses: actions/checkout@v4

      - name: نصب جاوا 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: بازسازی فایل‌های Gradle Wrapper
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            cp gradle/wrapper/gradle-wrapper.properties /tmp/gradle-wrapper.properties
          fi
          gradle wrapper
          if [ -f /tmp/gradle-wrapper.properties ]; then
            cp /tmp/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: فعال‌سازی AndroidX و پاکسازی تنظیمات محلی
        run: |
          rm -f local.properties
          touch gradle.properties
          sed -i '/android.useAndroidX/d' gradle.properties 2>/dev/null || true
          sed -i '/android.enableJetifier/d' gradle.properties 2>/dev/null || true
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: رفع خطای آیکون‌ها و رنگ transparent
        run: |
          sed -i 's|@mipmap/ic_launcher_round|@android:drawable/sym_def_app_icon|g' app/src/main/AndroidManifest.xml
          sed -i 's|@mipmap/ic_launcher|@android:drawable/sym_def_app_icon|g' app/src/main/AndroidManifest.xml
          find app/src/main/res/ -name "*.xml" -exec sed -i 's|@color/transparent|@android:color/transparent|g' {} +
          if [ -f app/src/main/res/values/colors.xml ]; then
            if ! grep -q 'name="transparent"' app/src/main/res/values/colors.xml; then
              sed -i 's|</resources>|    <color name="transparent">#00000000</color>\n</resources>|' app/src/main/res/values/colors.xml
            fi
          fi

      - name: فعال‌سازی MultiDex (حل خطای 64K)
        run: |
          # تنظیم minSdk روی 21 برای سازگاری کامل MultiDex
          sed -i -E 's/(minSdkVersion|minSdk)[[:space:]=]+[0-9]+/minSdk 21/g' app/build.gradle 2>/dev/null || true
          sed -i -E 's/(minSdkVersion|minSdk)[[:space:]=]+[0-9]+/minSdk = 21/g' app/build.gradle.kts 2>/dev/null || true
          
          # فعال‌سازی multiDexEnabled در تنظیمات
          if [ -f app/build.gradle ]; then
            if ! grep -q "multiDexEnabled" app/build.gradle; then
              sed -i '/defaultConfig[[:space:]]*{/a \        multiDexEnabled true' app/build.gradle
            fi
          fi
          if [ -f app/build.gradle.kts ]; then
            if ! grep -q "multiDexEnabled" app/build.gradle.kts; then
              sed -i '/defaultConfig[[:space:]]*{/a \        multiDexEnabled = true' app/build.gradle.kts
            fi
          fi

      - name: بیلد نهایی خروجی APK
        run: ./gradlew assembleDebug --no-daemon

      - name: ذخیره و آماده‌سازی فایل APK برای دانلود
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7