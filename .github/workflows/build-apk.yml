name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Fix gradle wrapper version and regenerate
        run: |
          sed -i 's|gradle-.*-bin.zip|gradle-8.7-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          gradle wrapper

      - name: Find and build project
        run: |
          find . -name "gradlew" -type f
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -1)
          chmod +x "$GRADLEW_PATH"
          "$GRADLEW_PATH" assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 7